<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}PT샵 네이버 블로그 매니저{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/style.css?v={{ static_version }}" />
  {% block extra_head %}{% endblock %}
</head>
<body>
  <div class="topbar">
    <div class="topbar__brand"><span class="dot"></span> 블로그 매니저</div>
    <nav class="topbar__nav">
      <a href="/" class="{{ 'active' if active_nav == 'dashboard' else '' }}">대시보드</a>
      <a href="/writer" class="{{ 'active' if active_nav == 'writer' else '' }}">글쓰기</a>
      <a href="/blogs" class="{{ 'active' if active_nav == 'blogs' else '' }}">블로그 관리</a>
      <a href="/settings" class="{{ 'active' if active_nav == 'settings' else '' }}">설정</a>
      <a href="#" id="naver-logout-link" title="네이버 계정 로그아웃" style="color:var(--text-faint); font-size:12.5px; margin-left:6px; padding:8px 10px;">로그아웃</a>
    </nav>
  </div>
  <div class="app-shell">
    {% block content %}{% endblock %}
  </div>
  <div id="toast" class="toast" hidden></div>
  <script src="/static/js/common.js?v={{ static_version }}"></script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
