{% extends "base.html" %}
{% block title %}설정 - PT샵 네이버 블로그 매니저{% endblock %}
{% block content %}

<div class="page-card" style="max-width:760px; margin:0 auto;">
  <h2 class="page-title">🤖 AI 설정</h2>
  <p class="page-sub">블로그 글 생성에 쓰는 OpenAI 키와, AI가 글을 쓸 때 따르는 규칙(프롬프트)을 관리합니다.</p>

  <form id="ai-settings-form">
    <div class="field">
      <label>OpenAI API 키 <span id="key-status" class="status-pill off">미설정</span></label>
      <input type="password" name="openai_api_key" autocomplete="new-password" placeholder="새 키를 입력하면 교체됩니다 (비우면 기존 키 유지)" />
    </div>
    <div class="field">
      <label>OpenAI 모델</label>
      <input type="text" name="openai_model" placeholder="gpt-4o-mini" />
    </div>
    <div class="field">
      <label>순위 자동 체크 주기 (시간)</label>
      <input type="number" name="rank_check_interval_hours" min="1" />
    </div>

    <hr style="border:none; border-top:1px solid var(--border); margin:20px 0;" />

    <div class="field">
      <label>✍️ AI 글쓰기 프롬프트</label>
      <p class="page-sub" style="margin:0 0 8px;">
        기본값 그대로 써도 됩니다. 수정하고 저장하면 그 다음부터는 이 내용대로 글이 생성됩니다.
      </p>
      <textarea
        name="custom_prompt"
        id="prompt-textarea"
        rows="16"
        style="font-family: ui-monospace, 'SFMono-Regular', Consolas, monospace; font-size:12.5px; line-height:1.6;"
      ></textarea>
    </div>
    <div style="margin-bottom:16px;">
      <button type="button" class="btn btn-outline" id="prompt-reset-btn">프롬프트 기본값으로 되돌리기</button>
    </div>

    <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center; padding:11px;">저장</button>
  </form>
</div>

{% endblock %}
{% block extra_scripts %}
<script src="/static/js/settings.js"></script>
{% endblock %}
